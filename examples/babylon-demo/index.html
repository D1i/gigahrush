<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Room Forge → Babylon: болванка уровня</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0e10; color: #dcd8cf; font: 13px/1.4 system-ui, sans-serif; }
      #c { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
      .panel { position: absolute; background: #18191cee; border: 1px solid #2d3035; border-radius: 6px; padding: 6px 10px; }
      #ui { top: 10px; left: 10px; display: flex; gap: 8px; align-items: center; }
      #ui select, #ui button { font: inherit; color: inherit; background: #272a2e; border: 1px solid #3a3e44; border-radius: 4px; height: 26px; }
      #help { left: 10px; bottom: 10px; color: #b3afa6; font-size: 12px; pointer-events: none; }
      #ui label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; user-select: none; }
      #info { color: #7f838a; font-family: ui-monospace, monospace; font-size: 11px; }
      #err { top: 50%; left: 50%; transform: translate(-50%, -50%); border-left: 3px solid #d8604a; max-width: 520px; display: none; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <canvas id="c" tabindex="0"></canvas>
    <div id="ui" class="panel">
      <select id="fixture" title="Фикстура из src/blockout/fixtures">
        <option value="run-gap1-30.json">30 комнат, стены 0.1 м</option>
        <option value="run-gap0-30.json">30 комнат вплотную (перегородки)</option>
        <option value="run-gap3-20.json">20 комнат, стены 0.3 м</option>
        <option value="run-gap1-150.json">150 комнат</option>
        <option value="./run-fold-overlap-60.json">складчатый (4D), 70 комнат, 215 пересечений в 3D, порталы</option>
        <option value="./run-fold-40.json">складчатый (4D), 40 комнат, 12 слоёв W</option>
      </select>
      <button id="open">Свой JSON прогона…</button>
      <label title="Обои, кафель, краска на стенах и покрытие пола по отделке комнат"><input id="finishes" type="checkbox" checked /> отделка</label>
      <input id="file" type="file" accept=".json,application/json" hidden />
      <span id="info"></span>
    </div>
    <div id="help" class="panel">Клик — захват мыши · WASD — ходьба · Esc — отпустить мышь</div>
    <div id="err" class="panel"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
