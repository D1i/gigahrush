<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>«Улыбка» — превью</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #030303; font: 12px/1.35 'IBM Plex Mono', monospace; color: #c9c2b4; }
      #c { display: block; width: 100%; height: 100%; }
      #ui { position: fixed; left: 8px; top: 8px; background: rgba(10, 9, 8, 0.82); border: 1px solid #3a342c; padding: 8px 10px; width: 250px; }
      #ui.off { display: none; }
      #ui b { color: #e8dcc6; }
      #ui .row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
      #ui .row label { width: 58px; }
      #ui input[type='range'] { flex: 1; }
      #ui button { background: #221e19; color: #d8cdb8; border: 1px solid #4a4238; padding: 2px 6px; margin: 1px; cursor: pointer; font: inherit; }
      #ui button.on { background: #5a2018; border-color: #a04030; }
      #info { margin-top: 4px; color: #8a8274; white-space: pre; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="ui">
      <b>«Улыбка»</b> — клавиши 1…8, ←/→ lean/pounce, T — torn, S — side, P — пауза
      <div id="scenes"></div>
      <div class="row"><label>torn</label><input id="torn" type="range" min="0" max="1" step="0.01" /><span id="tornV"></span></div>
      <div class="row"><label>lean</label><input id="lean" type="range" min="0" max="1" step="0.01" /><span id="leanV"></span></div>
      <div class="row"><label>pounce</label><input id="pounce" type="range" min="0" max="1" step="0.01" /><span id="pounceV"></span></div>
      <div class="row"><label>dist</label><input id="dist" type="range" min="0.6" max="16" step="0.1" /><span id="distV"></span></div>
      <div class="row"><button id="side">side</button><button id="flash">фонарь</button><button id="lit">свет</button><button id="orbit">орбита</button></div>
      <div id="info"></div>
    </div>
    <script type="module" src="./smile-preview.ts"></script>
  </body>
</html>
